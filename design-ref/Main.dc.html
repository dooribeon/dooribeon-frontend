<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두리번 시작 페이지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#fff}
a{color:#047857}a:hover{color:#065f46}
*{box-sizing:border-box}
.page{--g:#059669;--gd:#047857;--gl:#ECFDF5;--ink:#0B1F1A;--text:#1F2937;--muted:#4B5563;--line:#E5E7EB;font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);background:#fff;-webkit-font-smoothing:antialiased;word-break:keep-all;min-width:320px}
.page button,.page textarea{font:inherit}
.page button{cursor:pointer}
.page :focus-visible{outline:3px solid #059669;outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 고정 상단: 로고는 왼쪽 끝, 로그인(로그인 후 메뉴)은 오른쪽 끝 */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{height:68px;padding:0 clamp(20px,2.6vw,40px);display:flex;align-items:center;gap:8px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-size:23px;font-weight:800;letter-spacing:-.06em;min-height:44px}
.brand:hover{color:var(--ink)}
.brand svg{width:26px;height:34px;flex-shrink:0}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav-link{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#374151;text-decoration:none;font-size:15px;font-weight:500;letter-spacing:-.03em;border-radius:10px;white-space:nowrap}
.nav-link:hover{color:var(--gd);background:var(--gl)}
.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:-.03em;white-space:nowrap;transition:background .2s,color .2s}
.pill-fill{border:1px solid var(--gd);background:var(--gd);color:#fff;margin-left:6px}
.pill-fill:hover{background:#065f46}
.pill-line{border:1px solid var(--g);background:#fff;color:var(--gd);margin-left:8px}
.pill-line:hover{background:var(--gl)}

/* 히어로 */
.hero{position:relative;overflow:hidden;padding:56px 32px 64px}
.hero-in{position:relative;z-index:1;max-width:1200px;margin:0 auto}
.intro{text-align:center}
.intro h1{margin:0;font-size:clamp(38px,4.4vw,60px);line-height:1.2;letter-spacing:-.06em;font-weight:800;color:var(--ink);text-shadow:0 0 18px #fff,0 0 36px #fff,0 0 4px #fff}
.intro h1 span{color:var(--g)}
.intro p{margin:20px auto 0;max-width:640px;font-size:19px;line-height:1.7;color:var(--muted);letter-spacing:-.04em;text-shadow:0 0 10px #fff,0 0 22px #fff,0 0 3px #fff}

/* 심플 시작 화면: 제목·입력창·예시만 화면 가운데 (지도 애니메이션은 Main_map 보관본) */
.page > main{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}
.hero{overflow:visible;padding:clamp(40px,9vh,120px) 32px clamp(56px,12vh,160px)}
.intro{margin-bottom:44px}
/* 지도 무대: 지도·연결선·거점이 같은 좌표(중앙 = 내가 살 동네)를 공유 */
.stage{--s:1;--cy:175px;position:relative;height:330px;margin:8px auto 0}
.maplayer{position:absolute;left:50%;top:var(--cy);width:2000px;height:1200px;z-index:-1;transform-origin:1000px 620px;transform:translate(-1000px,-620px) scale(var(--s));pointer-events:none}
.maplayer svg{position:absolute;inset:0;width:2000px;height:1200px;overflow:visible}
.map-svg{opacity:.85;-webkit-mask-image:radial-gradient(ellipse 1000px 640px at 1000px 600px,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 1000px 640px at 1000px 600px,#000 40%,transparent 100%)}
.lines-svg line{stroke:#059669;stroke-opacity:.75;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:100 120;animation:draw 9s ease-out infinite both}
.ln-mob{display:none}
.base{position:absolute;z-index:2;left:calc(50% + var(--x) * var(--s) * 1px);top:calc(var(--cy) + var(--y) * var(--s) * 1px);display:flex;align-items:center;gap:9px;padding:7px 16px 7px 7px;background:#fff;border-radius:999px;box-shadow:0 5px 18px rgba(15,45,35,.15);font-size:14.5px;font-weight:700;color:var(--text);white-space:nowrap;letter-spacing:-.03em;animation:baseIn 9s ease-out infinite both}
.base .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.base .ic svg{width:19px;height:19px}
.b1{animation-delay:0s}.b2{animation-delay:.12s}.b3{animation-delay:.24s}.b4{animation-delay:.36s}.b5{animation-delay:.48s}.b6{animation-delay:.6s}

/* 눈 달린 핀: 위에서 떨어져 중앙 동네를 찍는다 (핀 끝 = 무대 중앙) */
.pin{position:absolute;left:50%;top:var(--cy);width:0;height:0;z-index:3}
/* 선택 범위는 생활거점 카드 뒤에 깔림: 좁은 화면에서 거점과 겹쳐도 거점이 가려지지 않음 */
.pin-under{z-index:1}
.pin-drop{position:absolute;left:-60px;top:-140px;width:120px;height:155px;transform-origin:60px 140px;animation:drop 9s infinite both}
.pin-drop svg{width:120px;height:155px;display:block;overflow:visible}
.pin-area{position:absolute;left:-80px;top:-50px;width:160px;height:100px;border-radius:48% 52% 46% 54% / 56% 46% 54% 44%;background:rgba(16,185,129,.22);border:2.5px solid rgba(5,150,105,.55);animation:area 9s infinite both}
.pin-shadow{position:absolute;left:-28px;top:-7px;width:56px;height:14px;border-radius:50%;background:rgba(11,42,34,.3);filter:blur(2px);animation:shadow 9s infinite both}
.pin-ripple{position:absolute;left:-44px;top:-15px;width:88px;height:30px;border-radius:50%;border:2.5px solid #059669;animation:ripple 9s ease-out infinite both}
.pupils{animation:look 9s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 9s linear infinite}

/* 입력창 */
.ask{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:20px 20px 20px 24px;border:1.5px solid var(--g);border-radius:20px;background:#fff;box-shadow:0 16px 40px rgba(5,150,105,.10);transition:box-shadow .2s}
.ask:focus-within{box-shadow:0 0 0 1.5px #059669,0 16px 40px rgba(5,150,105,.14)}
.ask textarea:focus,.ask textarea:focus-visible{outline:none}
.ask-icon{width:28px;height:28px;color:var(--g);flex-shrink:0}
.ask textarea{flex:1;min-width:0;height:58px;border:0;outline:none;resize:none;background:transparent;font-size:17px;line-height:1.7;letter-spacing:-.035em;color:var(--ink)}
.ask textarea::placeholder{color:#6B7280;opacity:1}
.send{width:52px;height:52px;flex-shrink:0;display:grid;place-items:center;border:0;border-radius:50%;background:var(--gd);color:#fff;transition:background .2s,transform .2s,opacity .2s}
.send svg{width:26px;height:26px}
.send:hover:not(:disabled){background:#065f46;transform:translateX(2px)}
.send:disabled{opacity:.4;cursor:not-allowed}

/* 예시 카드 */
.examples{max-width:880px;margin:26px auto 0}
.examples h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.03em;text-shadow:0 0 8px #fff,0 0 3px #fff}
.examples h2 svg{width:20px;height:20px;color:var(--g)}
.ex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ex{display:flex;align-items:center;gap:10px;min-height:76px;padding:14px 16px 14px 18px;border:1px solid #D7EFE5;border-radius:40px;background:#F2FAF6;text-align:left;color:var(--text);transition:border-color .2s,background .2s}
.ex:hover{border-color:var(--g);background:var(--gl)}
.ex .q{width:18px;height:18px;color:var(--g);align-self:flex-start;margin-top:3px;flex-shrink:0}
.ex span{flex:1;font-size:13.5px;line-height:1.75;letter-spacing:-.04em}
.ex .chev{width:18px;height:18px;color:#6B7280;flex-shrink:0}

/* 서비스 소개: 불편함 → 반복 확인 → 두리번의 해결, 세로 스토리 */
.story{scroll-margin-top:68px;padding:140px 32px 160px;background:#F4FAF7;border-top:1px solid #E3EFEA}
.story-in{max-width:1040px;margin:0 auto}
.story-head{text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid #CDEBDD;color:var(--gd);font-size:13px;font-weight:700;letter-spacing:-.02em}
.story h2{margin:20px 0 0;font-size:clamp(30px,3.6vw,50px);line-height:1.3;font-weight:800;letter-spacing:-.05em;color:var(--ink)}
.chap{max-width:920px;margin:0 auto;text-align:center}
.chap-gap{display:flex;justify-content:center;padding:36px 0}
.chap-gap span{width:2px;height:96px;background:repeating-linear-gradient(#A7D9C2 0 7px,transparent 7px 14px)}
.story-head + .chap-gap span{height:72px}
.chap-no{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid #A7D9C2;color:var(--gd);font-size:15px;font-weight:800}
.chap h3{margin:20px 0 0;font-size:clamp(26px,3vw,40px);line-height:1.35;font-weight:800;letter-spacing:-.05em;color:var(--ink)}
.chap-lead{margin:18px auto 0;max-width:640px;font-size:18px;line-height:1.75;color:var(--muted);letter-spacing:-.04em}
.viz{margin-top:44px;text-align:left;background:#fff;border:1px solid #DCE9E3;border-radius:28px;box-shadow:0 18px 50px rgba(15,45,35,.07)}

/* 1. 확인한 것 vs 아직 모르는 길 */
.viz-1{display:flex;align-items:stretch;gap:0;overflow:hidden}
.known{flex:0 0 300px;padding:32px;background:#F7FBF9;border-right:1px solid #E3EEE9;display:flex;flex-direction:column;gap:14px}
.known-top{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.04em}
.known-top svg{width:40px;height:52px;flex-shrink:0}
.ok{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid #D7EFE5;font-size:15px;font-weight:600;color:#1F2937;letter-spacing:-.03em}
.ok i{width:24px;height:24px;border-radius:50%;background:#047857;color:#fff;display:grid;place-items:center;flex-shrink:0}
.ok i svg{width:14px;height:14px}
.routes{flex:1;min-width:0;padding:32px 36px;display:flex;flex-direction:column;gap:12px}
.routes-label{font-size:13px;font-weight:700;color:#B45309;letter-spacing:-.02em;margin-bottom:4px}
.route{display:flex;align-items:center;gap:12px}
.r-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.r-ic svg{width:20px;height:20px}
.r-name{width:92px;font-size:16px;font-weight:700;color:#1F2937;letter-spacing:-.04em}
.r-line{flex:1;height:0;border-top:2px dashed #CBD5D1}
.r-q{min-width:64px;height:36px;padding:0 12px;border-radius:999px;border:1.5px dashed #E5A26A;color:#B45309;background:#FFF8F1;display:grid;place-items:center;font-size:15px;font-weight:800}
.route-more .r-ic{background:#fff;border:1.5px dashed #B8C6C0;color:#6B7280}
.route-more .r-name{color:#6B7280;width:auto}
.routes-note{margin-top:6px;font-size:13px;color:#6B7280}

/* 2. 동네 × 생활거점을 하나씩 */
.viz-2{padding:28px 28px 26px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px 10px 4px 4px;background:#F1F4F3;border:1px solid #E1E8E5;font-size:12.5px;color:#4B5563;white-space:nowrap}
.tab svg{width:13px;height:13px}
.tab-more{background:transparent;border-style:dashed;color:#6B7280}
.grid-box{overflow-x:auto;border-radius:16px;border:1px solid #E3EAE7}
.grid{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
.grid th,.grid td{padding:12px 10px;text-align:center;border-bottom:1px solid #EEF2F0;white-space:nowrap}
.grid thead th{background:#F7FAF9;font-size:13px;font-weight:700;color:#374151}
.grid tbody th{text-align:left;padding-left:16px;font-weight:700;color:#1F2937}
.grid tbody tr:last-child th,.grid tbody tr:last-child td{border-bottom:0}
.c{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:72px;height:30px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.c svg{width:13px;height:13px}
.c-done{background:#ECFDF5;color:#047857}
.c-now{background:#FFF7ED;color:#B45309;border:1px solid #FCD9B6}
.c-todo{border:1.5px dashed #CBD5D1;color:#6B7280}
.row-more th,.row-more td{opacity:.45}
.tally{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:15px;color:#374151;letter-spacing:-.03em}
.tally b{font-size:22px;color:#B45309;font-weight:800}

/* 3. 해결: 가장 강조 */
.solve{max-width:1040px;margin:0 auto;padding:80px 56px 64px;border-radius:36px;background:#064E3B;color:#fff;text-align:center;box-shadow:0 30px 80px rgba(6,78,59,.28)}
.solve-pin{width:64px;height:83px;display:block;margin:0 auto 18px}
.solve .chap-no{background:#0B5E48;border-color:#34D399;color:#A7F3D0}
.solve h3{margin:18px 0 0;font-size:clamp(30px,3.6vw,50px);line-height:1.3;font-weight:800;letter-spacing:-.05em;color:#fff}
.solve .chap-lead{color:#D1FAE5;max-width:680px;font-size:19px}
.solve-viz{margin-top:52px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:left}
.panel{width:100%;background:#fff;color:#1F2937;border-radius:24px;padding:24px 26px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel-head strong{font-size:17px;color:var(--ink);letter-spacing:-.04em}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:#F1F5F3;color:#4B5563;font-size:12px;font-weight:600}
.budget{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:#F7FAF9;border:1px solid #E3EAE7;font-size:14px;margin-bottom:12px}
.budget b{color:#047857}
.cond-box{overflow-x:auto}
.cond{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
.cond th,.cond td{padding:11px 10px;border-bottom:1px solid #EEF2F0;text-align:left;white-space:nowrap}
.cond thead th{font-size:12.5px;color:#6B7280;font-weight:600}
.cond tbody tr:last-child td{border-bottom:0}
.cond td:first-child{font-weight:700;color:var(--ink)}
.imp{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.imp-must{background:#064E3B;color:#fff}
.imp-hi{background:#D1FAE5;color:#065F46}
.imp-mid{background:#ECFDF5;color:#047857}
.imp-lo{background:#F1F5F3;color:#4B5563}
.muted{color:#9CA3AF}
.flow{display:flex;flex-direction:column;align-items:center;gap:6px;color:#A7F3D0;font-size:14px;font-weight:700}
.flow svg{width:26px;height:26px}
.cards-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#D1FAE5;font-size:14px}
.cards-head b{color:#fff;font-size:16px}
.cards{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rcard{background:#fff;color:#1F2937;border-radius:20px;padding:20px}
.rcard h4{margin:0;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.04em}
.rcard .strength{margin-top:4px;font-size:13px;color:#047857;font-weight:600}
.money{margin-top:14px;display:flex;gap:16px;padding:10px 12px;border-radius:12px;background:#F7FAF9;font-size:13px;color:#4B5563}
.money b{display:block;font-size:15px;color:var(--ink)}
.times{margin-top:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.times div{padding:8px 2px;border-radius:10px;background:#FAFBFB;border:1px solid #EEF2F0}
.times small{display:block;font-size:11.5px;color:#6B7280;white-space:nowrap}
.times b{display:block;margin-top:2px;font-size:15px;color:var(--ink)}
.times .over{background:#FFF7ED;border-color:#FCD9B6}
.times .over b{color:#C2410C}
.times .over em{display:block;font-style:normal;font-size:10.5px;color:#C2410C}
.solve-note{margin-top:28px;font-size:16px;line-height:1.7;color:#D1FAE5;letter-spacing:-.03em}
.solve-note strong{color:#fff}
.sample{margin-top:10px;font-size:12.5px;color:#A7F3D0}

/* 이용 방법 */
.howto{scroll-margin-top:68px;padding:120px 32px 140px;background:#fff}
.howto-in{max-width:960px;margin:0 auto}
.howto-head{text-align:center;margin-bottom:64px}
.howto h2{margin:20px 0 0;font-size:clamp(28px,3.4vw,44px);line-height:1.3;font-weight:800;letter-spacing:-.05em;color:var(--ink)}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;padding-bottom:72px}
.step:last-child{padding-bottom:0}
.step-rail{position:relative;display:flex;justify-content:center}
.step-num{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;background:var(--gd);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800;box-shadow:0 0 0 8px #fff}
.step-rail-line{position:absolute;top:48px;bottom:-72px;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(#BFE5D4 0 6px,transparent 6px 12px)}
.step:last-child .step-rail-line{display:none}
.step-label{font-size:13px;font-weight:700;color:var(--gd);letter-spacing:.02em}
.step h3{margin:8px 0 0;font-size:24px;line-height:1.4;font-weight:800;letter-spacing:-.045em;color:var(--ink)}
.step p{margin:12px 0 0;font-size:17px;line-height:1.75;color:var(--muted);letter-spacing:-.035em;max-width:640px}
.shot{margin:28px 0 0;border-radius:20px;border:1px solid #DCE5E1;background:#fff;box-shadow:0 18px 50px rgba(15,45,35,.08);overflow:hidden}
.shot-bar{height:38px;display:flex;align-items:center;gap:7px;padding:0 16px;background:#F5F7F6;border-bottom:1px solid #E6ECE9}
.shot-bar i{width:10px;height:10px;border-radius:50%;background:#D5DDD9;display:block}
.shot-body{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:16px;border:1.5px dashed #C9D6D0;border-radius:14px;background:#F7FAF9;text-align:center;padding:20px}
.shot-body svg{width:30px;height:30px;color:#6B7280}
.shot-body strong{font-size:15px;color:#374151;letter-spacing:-.03em}
.shot-body small{font-size:13px;color:#6B7280;letter-spacing:-.02em}

/* 내용이 짧아도 하단은 화면 맨 아래에 */
.page{display:flex;flex-direction:column;min-height:100vh}
.page > .top,.page > main,.page > .foot{flex-shrink:0;width:100%}
.foot{margin-top:auto}
.foot{padding:28px clamp(20px,2.6vw,40px);background:rgb(255,255,255)}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;font-size:13px;color:#6B7280}
.foot .brand{font-size:18px}
.foot .brand svg{width:20px;height:26px}

/* 애니메이션 (9초 반복): 거점 등장 → 핀이 위에서 떨어져 찍기 → 연결선 → 잠시 유지 → 사라짐 */

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { condition: '' };
  }
  renderVals() {
    var self = this;
    var examples = [
      '여의도 회사, 수원 본가, 월세 70만 원 이하로 살고 싶어요.',
      '강남 회사 주 5일 출근, 연인 집은 홍대, 월세 80만 원 이하예요.',
      '서울대 통학 예정이고, 본가는 대전이에요. 월세 60만 원 이하예요.'
    ];
    // 예시 카드는 입력창만 채우고, 전송은 사용자가 직접 한다.
    function fill(text) {
      return function () {
        self.setState({ condition: text });
        var el = document.getElementById('condition');
        if (el) { el.focus(); }
      };
    }
    var condition = this.state.condition || '';
    return {
      condition: condition,
      empty: condition.trim().length === 0,
      placeholder: '어디에 자주 가시나요? 예산은 어느 정도예요?\n자연어로 자유롭게 입력해주세요.',
      onChange: function (e) { self.setState({ condition: e.target.value }); },
      // 디자인 단계: 채팅 페이지 이동·AI 연동은 아직 연결하지 않음
      submit: function (e) { if (e && e.preventDefault) { e.preventDefault(); } },
      pick1: fill(examples[0]),
      pick2: fill(examples[1]),
      pick3: fill(examples[2])
    };
  }
}
</script>
